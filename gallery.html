<style>
.gallery-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.gallery-item{
position:relative;
overflow:hidden;
border-radius:15px;
}

.gallery-item img{
width:100%;
height:350px;
object-fit:cover;
transition:0.5s;
}

.gallery-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8));
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition:0.5s;
text-align:center;
padding:20px;
}

.gallery-overlay h3{
color:#d4af37;
font-size:22px;
}

.gallery-item:hover img{
transform:scale(1.2);
}

.gallery-item:hover .gallery-overlay{
opacity:1;
}
</style>

</head>
